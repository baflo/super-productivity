<div class="workflow-list">
  <div class="workflow-list-header">
    <button
      mat-button
      (click)="openEditor()"
    >
      <mat-icon>add</mat-icon>
      {{ T.F.WORKFLOW.LABEL.ADD_WORKFLOW | translate }}
    </button>
  </div>

  @if ((workflowService.allWorkflows$ | async)?.length === 0) {
    <p class="no-workflows">{{ T.F.WORKFLOW.LABEL.NO_WORKFLOWS | translate }}</p>
  }

  @for (wf of workflowService.allWorkflows$ | async; track wf.id) {
    <div class="workflow-item">
      <mat-slide-toggle
        [checked]="wf.isEnabled"
        (change)="toggleEnabled(wf)"
      ></mat-slide-toggle>
      <span class="workflow-title">{{ wf.title }}</span>
      <span class="workflow-trigger">{{
        T.F.WORKFLOW.TRIGGER[wf.trigger.type] | translate
      }}</span>
      <button
        mat-icon-button
        (click)="openEditor(wf)"
        [attr.aria-label]="T.F.WORKFLOW.LABEL.EDIT_WORKFLOW | translate"
      >
        <mat-icon>edit</mat-icon>
      </button>
      <button
        mat-icon-button
        class="color-warn"
        (click)="delete(wf)"
        [attr.aria-label]="T.F.WORKFLOW.LABEL.DELETE_WORKFLOW | translate"
      >
        <mat-icon>delete_forever</mat-icon>
      </button>
    </div>
  }
</div>
