# Fork-only: builds the web Docker image of the pushed branch and publishes it
# to the fork's GitHub Container Registry, for testing a change without a local
# build: docker pull ghcr.io/<owner>/super-productivity:<branch>
name: Fork test image (GHCR)

on:
  push:
    branches: [pwa-launch-handler]
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read
  packages: write

jobs:
  test_image:
    # Never runs in the upstream repository.
    if: github.repository_owner != 'johannesjo' && github.repository_owner != 'super-productivity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # Same workaround as publish-to-hub-docker.yml for git+https npm installs.
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/super-productivity
          tags: |
            type=ref,event=branch
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
