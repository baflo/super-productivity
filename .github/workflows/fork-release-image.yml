# Fork-only: when Super Productivity publishes a new release, builds the web
# Docker image of that release with this fork's patches (the commits of
# PATCH_BRANCH that are not in upstream master) and publishes it to the fork's
# GitHub Container Registry:
#   docker pull ghcr.io/<owner>/super-productivity:<version>   (or :latest)
# Runs daily, since upstream releases cannot trigger workflows in a fork.
# Scheduled workflows only run from the default branch, hence this file lives
# on master.
name: Fork release image (GHCR)

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag (empty = latest release)'
        required: false
      force:
        description: 'Rebuild even if the image already exists'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: super-productivity/super-productivity
  PATCH_BRANCH: pwa-launch-handler

jobs:
  release_image:
    # Never runs in the upstream repository.
    if: github.repository_owner != 'johannesjo' && github.repository_owner != 'super-productivity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Find the upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/super-productivity" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Skip if the image already exists
        id: check
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION exists already"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the fork
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the fork's patches to the release
        if: steps.check.outputs.build == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags "https://github.com/$UPSTREAM.git" \
            "+refs/heads/master:refs/remotes/upstream/master" \
            "+refs/tags/$TAG:refs/tags/$TAG"
          patches=$(git rev-list --reverse --no-merges "origin/$PATCH_BRANCH" --not upstream/master)
          echo "Patches from $PATCH_BRANCH:"
          git log --no-walk=unsorted --oneline $patches
          git checkout --detach "$TAG"
          git cherry-pick $patches

      # Same workaround as publish-to-hub-docker.yml for git+https npm installs.
      - name: Reconfigure git to use HTTP authentication
        if: steps.check.outputs.build == 'true'
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Build and push Docker image
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
